services:
  - type: web
    name: railpulse
    runtime: python
    rootDir: server
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: RAILPULSE_CORS
        value: https://railway-intelligence-system.vercel.app,http://localhost:5173
